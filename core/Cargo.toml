[package]
name = "eck_core"
version = "0.1.0"
edition = "2021"

[dependencies]
surrealdb = { version = "3", features = ["kv-surrealkv", "protocol-ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
regex = "1"
thiserror = "2.0"
tracing = "0.1"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1.0.102"
futures-util = "0.3"
murmur3 = "0.5"
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
chacha20poly1305 = "0.10"
jsonwebtoken = "9.3"
bcrypt = "0.15"
# Audit-anchor: pure-Rust Hedera HCS over gRPC (tonic + rustls, NO openssl —
# `cargo tree -i openssl-sys` must stay empty). We hand-build + Ed25519-sign
# Hedera transactions against hedera-proto; no `hedera` SDK crate. Requires
# `protoc` at build time (hedera-proto runs prost-build). See core/src/anchor.rs.
# NB: the legacy reqwest path in sync/hedera.rs POSTs to a read-only mirror node
# and cannot actually write to HCS — anchor.rs is the real submitter.
hedera-proto = "0.20"
tonic = { version = "0.12", default-features = false, features = ["codegen", "prost", "transport", "tls", "tls-webpki-roots"] }
prost = "0.13"
prost-types = "0.14"
# WASM plugin runtime (core/src/plugin). Extism host SDK on wasmtime/cranelift.
# default-features = false is LOAD-BEARING: it drops http/register-http/register-filesystem
# (URL+fs wasm loading and the plugin-side HTTP host fn) and with them the `ureq`/`url` TLS
# HTTP client — so NO TLS/HTTP client is dragged in. `cargo tree -i openssl-sys` MUST stay
# empty (invariant). We feed wasm bytes directly (Wasm::data) and expose zero I/O host
# functions, so none of those features are needed.
# `wasmtime-default-features` IS required though: it carries wasmtime's `std` feature, and
# extism's own code assumes `wasmtime::Error: std::error::Error` — without it extism itself
# will not compile (E0277 on every `?`). It pulls wasmtime's full default set (cranelift,
# async, gc, threads, cache, …), none of which touch TLS/HTTP/openssl.
extism = { version = "1.30", default-features = false, features = ["wasmtime-default-features"] }
# Import-section reader for the plugin capability pre-check (host.rs): we enumerate a
# module's imports BEFORE instantiation so a plugin importing a host fn it wasn't granted
# is rejected as CapabilityDenied, not as an opaque "unknown import" link failure. Pure
# Rust, already in the tree via wasmtime — no openssl. Pinned to the wasmtime-matching line.
wasmparser = "0.245"

[dev-dependencies]
# Compile hand-written WAT fixtures to wasm at test time so `cargo test` stays hermetic
# (no network, no checked-in binaries). Fixtures wrap the extism ABI kernel imports by hand.
wat = "1"

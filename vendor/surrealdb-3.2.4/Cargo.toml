[package]
edition = "2024"
name = "surrealdb"
version = "3.2.4"
authors = ["Tobie Morgan Hitchcock <tobie@surrealdb.com>"]
build = "build.rs"
publish = true
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A scalable, distributed, collaborative, document-graph database, for the realtime web"
homepage = "https://github.com/surrealdb/surrealdb"
documentation = "https://docs.rs/surrealdb/"
readme = "CARGO.md"
keywords = [
    "database",
    "embedded-database",
    "key-value",
    "key-value-store",
    "kv-store",
]
categories = [
    "database-implementations",
    "data-structures",
    "embedded",
]
license-file = "LICENSE"
repository = "https://github.com/surrealdb/surrealdb"

[package.metadata.docs.rs]
rustdoc-args = [
    "--cfg",
    "docsrs",
]
features = [
    "protocol-ws",
    "protocol-http",
    "kv-mem",
    "kv-rocksdb",
    "rustls",
    "native-tls",
    "http",
    "scripting",
]
targets = []

[package.metadata.cargo-machete]
ignored = ["surrealdb-types-derive"]

[features]
allocation-tracking = ["surrealdb-core/allocation-tracking"]
allocator = ["surrealdb-core/allocator"]
arbitrary = ["surrealdb-core/arbitrary"]
default = [
    "protocol-ws",
    "rustls",
]
http = ["surrealdb-core/http"]
jwks = ["surrealdb-core/jwks"]
kv-indxdb = ["surrealdb-core/kv-indxdb"]
kv-mem = [
    "surrealdb-core/kv-mem",
    "tokio/time",
]
kv-rocksdb = [
    "surrealdb-core/kv-rocksdb",
    "tokio/time",
]
kv-surrealkv = [
    "surrealdb-core/kv-surrealkv",
    "tokio/time",
]
kv-tikv = [
    "surrealdb-core/kv-tikv",
    "tokio/time",
]
ml = ["surrealdb-core/ml"]
native-tls = [
    "dep:native-tls",
    "reqwest?/native-tls",
    "tokio-tungstenite?/native-tls",
]
protocol-http = [
    "dep:reqwest",
    "surrealdb-types/reqwest",
]
protocol-ws = [
    "dep:tokio-tungstenite",
    "tokio/time",
]
rustls = [
    "dep:rustls",
    "reqwest?/default-tls",
    "tokio-tungstenite?/rustls-tls-webpki-roots",
]
scripting = ["surrealdb-core/scripting"]

[lib]
name = "surrealdb"

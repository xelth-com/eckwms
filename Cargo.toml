[workspace]
members = ["core", "wms", "relay", "compliance", "migrator"]
resolver = "2"

# Vendored surrealdb-engine-local crate (the rest of surrealdb stays from
# crates.io). The only change vs upstream 3.3.5 is a ~8-line patch in
# `src/lib.rs::connect` that re-injects the endpoint query params UNPREFIXED
# onto the datastore builder's ConfigMap, so the embedded SurrealKV block-cache
# / memtable / HNSW-cache tuning keys actually take effect (upstream
# force-prefixes them with `datastore_` and they never match the parsers). See
# vendor/surrealdb-engine-local-3.3.5/README-ECK-PATCH.md for the exact diff and
# upgrade instructions.
[patch.crates-io]
surrealdb-engine-local = { path = "vendor/surrealdb-engine-local-3.3.5" }
